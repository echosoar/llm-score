<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LLM Score</title>
  <meta name="description" content="LLM Score 汇总主流大语言模型的综合多维度评分与基准测试表现，覆盖性能指数、价格综合指数、输入输出价格、上下文窗口等维度，并使用最新汇率计算价格，支持按厂商筛选与排序。">
  <meta name="keywords" content="LLM,大语言模型,模型评分,模型排行榜,基准测试,Benchmark,性能指数,模型价格,上下文窗口,GPT,Claude,Gemini,DeepSeek,Kimi,Qwen">
  <style>
    :root {
      --background: #ffffff;
      --text: rgba(0, 0, 0, 0.88);
      --text-strong: #000000;
      --muted: rgba(0, 0, 0, 0.55);
      --faint: rgba(0, 0, 0, 0.35);
      --line: rgba(0, 0, 0, 0.12);
      --line-soft: rgba(0, 0, 0, 0.07);
      --chip-active: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(100%, 1800px);
      margin: 0 auto;
      padding: 64px 48px 48px;
    }

    header {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    /* 视图切换：仅用文字深浅区分，无背景与边框 */
    .view-toggle {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .view-option {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .view-option[aria-pressed="true"] {
      color: var(--text-strong);
    }

    .description,
    #status {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    #status {
      margin: 0;
      text-align: right;
      white-space: nowrap;
    }

    .lang-toggle {
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
    }

    .brand-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 0;
      max-width: 100%;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .brand-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      flex: none;
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .brand-chip .brand-icon {
      width: 14px;
      height: 14px;
    }

    .brand-chip[aria-pressed="true"] {
      background: var(--chip-active);
      border-color: var(--chip-active);
      color: #ffffff;
    }

    .selection-bar {
      display: flex;
      flex-wrap: wrap;
      /* stretch 让同一行内的模型 item 与对比按钮高度完全一致 */
      align-items: stretch;
      gap: 10px;
      margin: 0 0 24px;
    }

    .selection-label {
      display: inline-flex;
      align-items: center;
      margin-right: 4px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .selection-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.04);
      font-size: 12px;
    }

    .selection-chip-brand {
      color: var(--muted);
    }

    .selection-chip-name {
      color: var(--text-strong);
      font-weight: 600;
    }

    .selection-remove {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .compare-button {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .compare-button[aria-pressed="true"] {
      background: var(--chip-active);
      border-color: var(--chip-active);
      color: #ffffff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 2180px;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    tr:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    th,
    td {
      padding: 16px 14px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    thead {
      background: var(--background);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      border-bottom: 1px solid var(--line);
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    tbody tr {
      border-top: 1px solid var(--line-soft);
    }

    #score-table tbody tr {
      cursor: pointer;
    }

    #score-table tbody tr[aria-selected="true"] {
      background: rgba(0, 0, 0, 0.03);
    }

    #compare-wrap table {
      width: auto;
      min-width: 0;
    }

    #compare-table tr:hover {
      background: transparent;
    }

    #compare-table th:first-child,
    #compare-table td:first-child {
      min-width: 200px;
      padding-left: 0;
    }

    #compare-table th:not(:first-child),
    #compare-table td:not(:first-child) {
      min-width: 190px;
    }

    /* 对比模式下数值左对齐，属性名与取值贴近，便于横向阅读 */
    #compare-table .numeric {
      text-align: left;
    }

    .compare-attr {
      color: var(--muted);
    }

    .compare-model {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .compare-model-name {
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: none;
    }

    .compare-model-brand {
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .compare-win {
      color: var(--text-strong);
      font-weight: 650;
    }

    .compare-lose {
      color: rgba(0, 0, 0, 0.38);
    }

    .compare-plain {
      color: rgba(0, 0, 0, 0.55);
    }

    /* 数值后的名次比数值本身更浅，落后一侧再浅一档以保持层级 */
    .value-rank {
      color: var(--faint);
    }

    .compare-lose .value-rank {
      color: rgba(0, 0, 0, 0.26);
    }

    /* 天梯模式：行=分数段（自上而下由高到低），列=厂商（自左向右由强到弱） */
    #ladder-wrap table {
      width: auto;
      min-width: 0;
    }

    #ladder-table tr:hover {
      background: transparent;
    }

    #ladder-table th,
    #ladder-table td {
      vertical-align: top;
    }

    #ladder-table th:not(:first-child),
    #ladder-table td:not(:first-child) {
      min-width: 168px;
    }

    /* 分数段列横向滚动时固定在左侧，便于对照当前行所处的分数区间 */
    #ladder-table th:first-child,
    #ladder-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      min-width: 116px;
      padding-right: 24px;
      padding-left: 0;
      background: var(--background);
    }

    #ladder-table thead th:first-child {
      z-index: 3;
    }

    /* 分数段是行表头，需要去掉全局 th 的置顶粘性与视觉强调 */
    #ladder-table tbody th {
      top: auto;
      border-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .ladder-tier {
      font-variant-numeric: tabular-nums;
    }

    .ladder-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .ladder-model {
      max-width: 200px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-strong);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      white-space: normal;
      cursor: pointer;
    }

    /* 左右滚动按钮：固定在视口两侧垂直居中，仅当前表格可横向滚动且未滚到边缘时显示 */
    .scroll-nav {
      position: fixed;
      top: 50%;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--background);
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .scroll-nav:hover {
      color: var(--text-strong);
    }

    .scroll-nav-left { left: 8px; }

    .scroll-nav-right { right: 8px; }

    .scroll-nav:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.55);
      outline-offset: 3px;
    }

    /* 排名表横向滚动时，# 与模型名称两列固定在左侧，纵向跟随行滚动 */
    #score-table th:nth-child(1),
    #score-table td:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--background);
    }

    #score-table th:nth-child(2),
    #score-table td:nth-child(2) {
      position: sticky;
      left: var(--pin-2, 0px);
      z-index: 2;
      background: var(--background);
    }

    /* 固定列背景不透明，行 hover 与选中态需要同步成与叠加色等效的实色 */
    #score-table tbody tr:hover td:nth-child(-n+2),
    #score-table tbody tr[aria-selected="true"] td:nth-child(-n+2) {
      background: #f7f7f7;
    }

    /* 对比表第一列（属性名）同样在横向滚动时固定在左侧 */
    #compare-table th:first-child,
    #compare-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--background);
    }

    /* 吸顶表头：原表头滚出视口后显示的克隆条，横向跟随表格滚动 */
    .sticky-head {
      position: fixed;
      top: 0;
      z-index: 8;
      overflow: hidden;
      background: var(--background);
    }

    .sticky-head table {
      width: auto;
      min-width: 0;
      table-layout: fixed;
    }

    /* 覆盖全局 th 的 sticky 吸顶，克隆条内由 JS 平移控制 */
    .sticky-head th {
      position: relative;
      z-index: 0;
    }

    .sticky-head--rank th:nth-child(-n+2),
    .sticky-head--compare th:nth-child(1),
    .sticky-head--ladder th:nth-child(1) {
      z-index: 1;
      background: var(--background);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 24px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.28);
    }

    .modal {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid var(--line);
      background: var(--background);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .modal-title {
      margin: 0;
      color: var(--text-strong);
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .modal-brand {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-close {
      flex: none;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-table {
      width: 100%;
      min-width: 0;
    }

    .modal-table tr:hover {
      background: transparent;
    }

    .modal-table th,
    .modal-table td {
      padding: 10px 0;
      white-space: normal;
    }

    .modal-table th {
      position: static;
      width: 45%;
      border-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .modal-table td {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .modal-close:focus-visible,
    .view-option:focus-visible,
    .ladder-model:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.55);
      outline-offset: 3px;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-align: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .sort-button::after {
      color: var(--faint);
      content: "↕";
      font-size: 13px;
      line-height: 1;
    }

    .sort-button[aria-sort="ascending"]::after {
      color: var(--text-strong);
      content: "↑";
    }

    .sort-button[aria-sort="descending"]::after {
      color: var(--text-strong);
      content: "↓";
    }

    .sort-button:focus-visible,
    a:focus-visible,
    .brand-chip:focus-visible,
    .compare-button:focus-visible,
    .selection-remove:focus-visible,
    .lang-toggle:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.55);
      outline-offset: 3px;
    }

    .model-name {
      color: var(--text-strong);
      font-weight: 600;
    }

    .numeric {
      text-align: right;
    }

    .dimensional-score {
      color: rgba(0, 0, 0, 0.62);
    }

    .missing {
      color: var(--faint);
    }

    a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .website-link::after {
      content: " ↗";
      font-size: 11px;
    }

    .empty,
    .error {
      padding: 48px 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 680px) {
      main { padding: 36px 20px 28px; }
      header { align-items: start; flex-direction: column; gap: 12px; }
      .title-row { flex-wrap: wrap; gap: 8px 16px; }
      .modal-overlay { padding: 32px 16px; }
      .modal { padding: 24px 20px; }
      #status { text-align: left; white-space: normal; }
      .lang-toggle {
        position: absolute;
        top: 40px;
        right: 12px;
      }
    }

    .site-footer {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 13px;
    }

    .updated-at {
      color: var(--muted);
    }

    .footer-link {
      color: var(--text);
    }

    .footer-counter {
      display: block;
      height: 48px;
      width: auto;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="title-row">
          <h1>LLM Score</h1>
          <div class="view-toggle" id="view-toggle" role="group" aria-label="视图模式"></div>
        </div>
        <p class="description" data-i18n="description">模型综合多维度测试评分与基准测试表现，使用最新汇率计算价格</p>
        <div class="brand-filter" id="brand-filter" role="group" aria-label="厂商过滤"></div>
      </div>
      <div class="header-right">
        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="切换语言">EN</button>
        <p id="status" aria-live="polite" data-i18n="loading">正在加载数据…</p>
      </div>
    </header>

    <div class="selection-bar" id="selection-bar" hidden></div>

    <div class="table-wrap" id="table-wrap">
      <table id="score-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="table-wrap" id="compare-wrap" hidden>
      <table id="compare-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="table-wrap" id="ladder-wrap" hidden>
      <table id="ladder-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <button class="scroll-nav scroll-nav-left" id="scroll-nav-left" type="button" aria-label="向左滚动" hidden>←</button>
    <button class="scroll-nav scroll-nav-right" id="scroll-nav-right" type="button" aria-label="向右滚动" hidden>→</button>
    <div class="sticky-head" id="sticky-head" hidden>
      <table>
        <thead></thead>
      </table>
    </div>

    <footer class="site-footer">
      <span class="updated-at" id="updated-at"></span>
      <a class="footer-link" href="https://aiznb.com/about" target="_blank" rel="noopener">Created by Soar</a>
      <a class="footer-link" href="https://x.com/intent/user?screen_name=codersoar" target="_blank" rel="noopener">X</a>
      <a class="footer-link" href="https://github.com/echosoar/llm-score" target="_blank" rel="noopener">GitHub</a>
      <img class="footer-counter" src="https://not.aiznb.com/img?url=https://echosoar.github.io/llm-score/"  />
    </footer>
  </main>

  <div class="modal-overlay" id="model-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="modal-title"></h2>
          <p class="modal-brand" id="modal-brand"></p>
        </div>
        <button class="modal-close" id="modal-close" type="button">✕</button>
      </div>
      <table class="modal-table">
        <tbody id="modal-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const table = document.querySelector('#score-table');
    const tableHead = table.querySelector('thead');
    const tableBody = table.querySelector('tbody');
    const tableWrap = document.querySelector('#table-wrap');
    const compareTable = document.querySelector('#compare-table');
    const compareHead = compareTable.querySelector('thead');
    const compareBody = compareTable.querySelector('tbody');
    const compareWrap = document.querySelector('#compare-wrap');
    const ladderTable = document.querySelector('#ladder-table');
    const ladderHead = ladderTable.querySelector('thead');
    const ladderBody = ladderTable.querySelector('tbody');
    const ladderWrap = document.querySelector('#ladder-wrap');
    const viewToggle = document.querySelector('#view-toggle');
    const modal = document.querySelector('#model-modal');
    const modalTitle = document.querySelector('#modal-title');
    const modalBrand = document.querySelector('#modal-brand');
    const modalBody = document.querySelector('#modal-body');
    const modalClose = document.querySelector('#modal-close');
    const pageMain = document.querySelector('main');
    const selectionBar = document.querySelector('#selection-bar');
    const status = document.querySelector('#status');
    const brandFilter = document.querySelector('#brand-filter');
    const langToggle = document.querySelector('#lang-toggle');
    const updatedAtNode = document.querySelector('#updated-at');
    const scrollNavLeft = document.querySelector('#scroll-nav-left');
    const scrollNavRight = document.querySelector('#scroll-nav-right');
    const stickyHead = document.querySelector('#sticky-head');
    const stickyHeadTable = stickyHead.querySelector('table');
    const stickyHeadThead = stickyHead.querySelector('thead');

let models = [];
let benchmarks = [];
let priceMap = {};
let brandIcons = {};
let updatedAt = null;
let rankMap = new Map();
let priceNormMap = new Map();
let modelMap = new Map();
    let sortState = { key: 'score', direction: 'desc' };
    let selectedBrands = new Set();
    // 选中的模型（按点击顺序），以及对比模式状态
    let selectedModels = [];
    let compareMode = false;
    let compareSort = { model: null, direction: null };
    // 视图模式：rank（排名表格）/ ladder（天梯）
    let viewMode = 'rank';
    // 数据加载失败标记，置位后任何一次 render 都保持错误提示可见
    let loadFailed = false;
    // 天梯中点击模型后展示详情的模型 key，以及关闭弹层后需要还原焦点的元素
    let modalModel = null;
    let modalReturnFocus = null;
    let overlayPressed = false;
    let lang = 'zh';

const formatFormats = (formats) =>
  Array.isArray(formats) && formats.length ? formats.join(' / ') : '-';

const formatWindow = (value) => {
  if (value === null || value === undefined || value === '') return '-';
  const num = Number(value);
  if (!Number.isFinite(num)) return String(value);
  if (num % (1024 * 1024) === 0) {
    return `${num / (1024 * 1024)}M`;
  }
  if (num % 1024 === 0) {
    const k = num / 1024;
    return k >= 1024 ? `${k / 1024}M` : `${k}K`;
  }
  if (num >= 1000000) {
    const m = num / 1000000;
    return `${Number.isInteger(m) ? m : m.toFixed(2).replace(/\.?0+$/, '')}M`;
  }
  if (num >= 1000) {
    const k = num / 1000;
    return `${Number.isInteger(k) ? k : k.toFixed(1).replace(/\.?0+$/, '')}K`;
  }
  return String(num);
};

const PRICE_REGEX = /^([￥$])\s*([\d.]+)$/;

const getPriceAmount = (price) => {
  if (price === null || price === undefined || price === '') return null;
  const match = PRICE_REGEX.exec(String(price).trim());
  if (!match) return null;
  const [, symbol, amount] = match;
  const num = Number(amount);
  if (!Number.isFinite(num)) return null;
  const target = lang === 'zh' ? '￥' : '$';
  if (symbol === target) return num;
  if (!priceMap['$'] || !priceMap['￥']) return num;
  const rate = target === '￥' ? priceMap['$'] / priceMap['￥'] : priceMap['￥'] / priceMap['$'];
  return num * rate;
};

const formatPrice = (price) => {
  if (price === null || price === undefined || price === '') return '-';
  const amount = getPriceAmount(price);
  if (amount === null) return String(price);
  const target = lang === 'zh' ? '￥' : '$';
  const rounded = Number.isInteger(amount) ? amount : Number(amount.toFixed(2));
  return `${target}${rounded}`;
};

const getPriceIndex = (model) => {
  const input = getPriceAmount(model.inputPrice);
  if (input === null) return null;
  const cached = getPriceAmount(model.inputCachedPrice);
  const output = getPriceAmount(model.outputPrice);
  if (output === null) return null;
  return input * 5 + (cached ?? input) * 20 + output * 1;
};

const formatPriceIndex = (model) => {
  const value = getPriceIndex(model);
  if (value === null) return '-';
  const target = lang === 'zh' ? '￥' : '$';
  const rounded = Number.isInteger(value) ? value : Number(value.toFixed(2));
  return `${target}${rounded}`;
};

const getPriceMultiplier = (model) => priceNormMap.get(model.model) ?? null;

const getPriceScore = (model) => {
  const multiplier = getPriceMultiplier(model);
  if (multiplier === null || model.score === null || model.score === undefined) return null;
  const value = getPriceIndex(model);
  return model.score / Math.pow(value, 0.1);
  // return Math.sqrt(model.score) * ((multiplier + 0.1) * 0.9);
};

    const getSortValue = (model, key) => {
      if (key.startsWith('benchmark:')) {
        return getBenchmarkScore(model, key.slice('benchmark:'.length));
      }
      if (key === 'inputPrice' || key === 'inputCachedPrice' || key === 'outputPrice') {
        return getPriceAmount(model[key]);
      }
      if (key === 'priceIndex') return getPriceIndex(model);
      if (key === 'priceScore') return getPriceScore(model);
      if (key === 'input' || key === 'output') return formatFormats(model[key]);
      return model[key] ?? null;
    };

    const compareValues = (left, right) => {
      const leftMissing = left === null || left === undefined || left === '';
      const rightMissing = right === null || right === undefined || right === '';
      if (leftMissing || rightMissing) return leftMissing === rightMissing ? 0 : leftMissing ? 1 : -1;
      if (typeof left === 'number' && typeof right === 'number') return left - right;
      return String(left).localeCompare(String(right), 'zh-CN', { numeric: true, sensitivity: 'base' });
    };

    const sortModels = () => {
      const { key, direction } = sortState;
      const multiplier = direction === 'asc' ? 1 : -1;
      const filtered = selectedBrands.size
        ? models.filter((model) => selectedBrands.has(model.brand))
        : models;
      return filtered.sort((left, right) => {
        const leftValue = getSortValue(left, key);
        const rightValue = getSortValue(right, key);
        const leftMissing = leftValue === null || leftValue === undefined || leftValue === '';
        const rightMissing = rightValue === null || rightValue === undefined || rightValue === '';
        // 缺失值不论升序降序都排到最后，缺失项之间按 # 序号排序
        if (leftMissing || rightMissing) {
          if (leftMissing && rightMissing) {
            return (rankMap.get(left.model) ?? Infinity) - (rankMap.get(right.model) ?? Infinity);
          }
          return leftMissing ? 1 : -1;
        }
        const result = compareValues(leftValue, rightValue);
        return result === 0 ? left.model.localeCompare(right.model, 'zh-CN') : result * multiplier;
      });
    };

      if (compareSort.model && !selectedModels.includes(compareSort.model)) {

    const toNumber = (value) => {
      if (value === null || value === undefined || value === '') return null;
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    };

    const formatCount = (formats) => (Array.isArray(formats) && formats.length ? formats.length : null);

    // 在所有有该项数据的模型中的名次，分数越高名次越前，同分并列同名次
    const getMetricRank = (model, getValue) => {
      const own = toNumber(getValue(model));
      if (own === null) return null;
      let better = 0;
      models.forEach((other) => {
        const value = toNumber(getValue(other));
        if (value !== null && value > own) better += 1;
      });
      return better + 1;
    };

    // 名次以更浅的文字跟在数值后面，作为独立节点渲染
    const appendRankSuffix = (cell, definition, model) => {
      if (!definition.rank || cell.textContent === '-') return;
      const rank = definition.rank(model);
      if (rank === null) return;
      const suffix = document.createElement('span');
      suffix.className = 'value-rank';
      suffix.textContent = ` (#${rank})`;
      cell.append(suffix);
    };

    // 对比模式的属性行：better 表示哪一侧胜出，plain 行仅展示不参与胜出判定
    const buildCompareRows = () => {
      const rows = [
        { label: t('colScore'), better: 'high', numeric: true, value: (m) => toNumber(m.score), format: (m) => formatScore(m.score), rank: (m) => getMetricRank(m, (item) => item.score) },
        { label: t('colPriceScore'), better: 'high', numeric: true, value: (m) => toNumber(getPriceScore(m)), format: (m) => formatScore(getPriceScore(m)), rank: (m) => getMetricRank(m, getPriceScore) },
        { label: t('colTime'), better: 'high', value: (m) => m.time ?? null, format: (m) => m.time ?? '-' },
        { label: t('colInput'), better: 'high', value: (m) => formatCount(m.input), format: (m) => formatFormats(m.input) },
        { label: t('colOutput'), better: 'high', value: (m) => formatCount(m.output), format: (m) => formatFormats(m.output) },
        { label: t('colInputPrice'), better: 'low', numeric: true, value: (m) => getPriceAmount(m.inputPrice), format: (m) => formatPrice(m.inputPrice) },
        { label: t('colInputCachedPrice'), better: 'low', numeric: true, value: (m) => getPriceAmount(m.inputCachedPrice), format: (m) => formatPrice(m.inputCachedPrice) },
        { label: t('colOutputPrice'), better: 'low', numeric: true, value: (m) => getPriceAmount(m.outputPrice), format: (m) => formatPrice(m.outputPrice) },
        { label: t('colContext'), better: 'high', numeric: true, value: (m) => toNumber(m.context), format: (m) => formatWindow(m.context) },
        { label: t('colGenerate'), better: 'high', numeric: true, value: (m) => toNumber(m.generate), format: (m) => formatWindow(m.generate) },
        ...benchmarks.map((benchmark) => ({
          key: `benchmark:${benchmark}`,
          label: benchmark,
          better: 'high',
          numeric: true,
          value: (m) => getBenchmarkScore(m, benchmark),
          format: (m) => formatBenchmarkScore(getBenchmarkScore(m, benchmark)),
          rank: (m) => getMetricRank(m, (item) => getBenchmarkScore(item, benchmark)),
        })),
      ];
      const plainRows = [
        { key: 'rank', label: t('colRank'), plain: true, numeric: true, value: (m) => rankMap.get(m.model) ?? null, format: (m) => String(rankMap.get(m.model) ?? '-') },
        { key: 'url', label: t('colUrl'), plain: true, link: true, value: (m) => m.url ?? null },
      ];
      return { rows, plainRows };
    };

    const isMissing = (value) => value === null || value === undefined || value === '';

    const computeWinners = (definition, values) => {
      const valid = values.filter((value) => !isMissing(value));
      if (!valid.length) return values.map(() => false);
      const sorted = [...valid].sort(compareValues);
      const best = definition.better === 'low' ? sorted[0] : sorted[sorted.length - 1];
      return values.map((value) => !isMissing(value) && compareValues(value, best) === 0);
    };

    const makeCompareEntry = (definition, list) => {
      const values = list.map((model) => definition.value(model));
      return {
        definition,
        values,
        // 全部模型都没有数据的属性行不展示
        hasData: values.some((value) => !isMissing(value)),
        winners: definition.plain ? values.map(() => false) : computeWinners(definition, values),
      };
    };

    const sameValue = (left, right) => {
      if (isMissing(left) || isMissing(right)) return isMissing(left) && isMissing(right);
      return compareValues(left, right) === 0;
    };

    // 相对某个模型的属性行分组：胜出 / 与其他模型一致 / 落后
    const getRowStatus = (entry, index) => {
      const own = entry.values[index];
      const tiedWithAll = entry.values.every((value, i) => i === index || sameValue(value, own));
      if (tiedWithAll) return 'same';
      return entry.winners[index] ? 'win' : 'lose';
    };

    const appendCompareValueCell = (row, model, definition, isWinner) => {
      const cell = document.createElement('td');
      const classes = [];
      if (definition.numeric) classes.push('numeric');
      if (definition.plain) classes.push('compare-plain');
      else classes.push(isWinner ? 'compare-win' : 'compare-lose');
      cell.className = classes.join(' ');
      if (definition.link) {
        if (model.url) {
          const link = document.createElement('a');
          link.className = 'website-link';
          link.href = model.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = t('website');
          cell.append(link);
        } else {
          cell.textContent = '-';
        }
      } else {
        cell.textContent = definition.format(model);
        appendRankSuffix(cell, definition, model);
      }
      row.append(cell);
    };

    const renderCompare = () => {
      const list = selectedModels.map((key) => modelMap.get(key)).filter(Boolean);
      const headRow = document.createElement('tr');
      const corner = document.createElement('th');
      corner.scope = 'col';
      headRow.append(corner);

      list.forEach((model) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        const button = document.createElement('button');
        button.className = 'sort-button';
        button.type = 'button';
        const wrap = document.createElement('span');
        wrap.className = 'compare-model';
        const name = document.createElement('span');
        name.className = 'compare-model-name';
        name.textContent = model.model;
        const brand = document.createElement('span');
        brand.className = 'compare-model-brand';
        brand.textContent = model.brand ?? '-';
        wrap.append(name, brand);
        button.append(wrap);
        // 点击表头模型：先把该模型胜出的属性排到前面，再点反向，第三次取消排序
        button.setAttribute('aria-sort', compareSort.model === model.model
          ? (compareSort.direction === 'win' ? 'descending' : 'ascending')
          : 'none');
        button.addEventListener('click', () => {
          if (compareSort.model !== model.model) compareSort = { model: model.model, direction: 'win' };
          else if (compareSort.direction === 'win') compareSort = { model: model.model, direction: 'lose' };
          else compareSort = { model: null, direction: null };
          render();
        });
        cell.append(button);
        headRow.append(cell);
      });
      compareHead.replaceChildren(headRow);

      const { rows, plainRows } = buildCompareRows();
      let entries = rows
        .map((definition) => makeCompareEntry(definition, list))
        .filter((entry) => entry.hasData);

      const index = list.findIndex((model) => model.model === compareSort.model);
      if (compareSort.direction && index >= 0) {
        // 正序：胜出 → 与其他模型一致 → 落后；倒序反过来
        const groups = { win: [], same: [], lose: [] };
        entries.forEach((entry) => groups[getRowStatus(entry, index)].push(entry));
        entries = compareSort.direction === 'win'
          ? [...groups.win, ...groups.same, ...groups.lose]
          : [...groups.lose, ...groups.same, ...groups.win];
      }

      const allEntries = [
        ...entries,
        ...plainRows
          .map((definition) => makeCompareEntry(definition, list))
          .filter((entry) => entry.hasData),
      ];

      const fragment = document.createDocumentFragment();
      allEntries.forEach(({ definition, winners }) => {
        const row = document.createElement('tr');
        appendTextCell(row, definition.label, 'compare-attr');
        list.forEach((model, index) => {
          appendCompareValueCell(row, model, definition, winners[index]);
        });
        fragment.append(row);
      });
      compareBody.replaceChildren(fragment);
    };

    const getTierLower = (score) => Math.floor(score / TIER_STEP) * TIER_STEP;

    const formatTier = (lower) => `${lower}~${lower + TIER_STEP}`;

    // 天梯数据：列按厂商最高分从左到右递减，行按分数段从上到下递减，
    // 每格放这个厂商落在这个分数段里的模型（按分数从高到低）
    const buildLadder = () => {
      const scored = models.filter((model) => toNumber(model.score) !== null);
      if (!scored.length) return { tiers: [], brands: [], cells: new Map() };

      const values = scored.map((model) => Number(model.score));
      // 最低分段固定不高于 10~15，最高分段跟随数据自动上探
      const minTier = Math.min(getTierLower(Math.min(...values)), 10);
      const maxTier = getTierLower(Math.max(...values));
      const tiers = [];
      for (let lower = maxTier; lower >= minTier; lower -= TIER_STEP) tiers.push(lower);

      const brandBest = new Map();
      const cells = new Map();
      scored.forEach((model) => {
        const score = Number(model.score);
        const best = brandBest.get(model.brand);
        if (best === undefined || score > best) brandBest.set(model.brand, score);
        const key = `${model.brand}\u0000${getTierLower(score)}`;
        if (!cells.has(key)) cells.set(key, []);
        cells.get(key).push(model);
      });
      cells.forEach((list) => {
        list.sort((left, right) => Number(right.score) - Number(left.score)
          || left.model.localeCompare(right.model, 'zh-CN'));
      });

      const brands = [...brandBest.entries()]
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh-CN', { sensitivity: 'base' }))
        .map(([brand]) => brand);

      return { tiers, brands, cells };
    };

    const renderLadder = () => {
      const { tiers, brands, cells } = buildLadder();

      const headRow = document.createElement('tr');
      const corner = document.createElement('th');
      corner.scope = 'col';
      corner.textContent = t('colTier');
      headRow.append(corner);
      brands.forEach((brand) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        const wrap = document.createElement('span');
        wrap.className = 'brand-cell';
        const icon = createBrandIcon(brand);
        if (icon) wrap.append(icon);
        const label = document.createElement('span');
        label.textContent = brand;
        wrap.append(label);
        cell.append(wrap);
        headRow.append(cell);
      });
      ladderHead.replaceChildren(headRow);

      const fragment = document.createDocumentFragment();
      tiers.forEach((lower) => {
        const row = document.createElement('tr');
        const tierCell = document.createElement('th');
        tierCell.scope = 'row';
        tierCell.className = 'ladder-tier';
        tierCell.textContent = formatTier(lower);
        row.append(tierCell);
        brands.forEach((brand) => {
          const list = cells.get(`${brand}\u0000${lower}`) ?? [];
          const cell = document.createElement('td');
          if (!list.length) {
            cell.className = 'missing';
            cell.textContent = '-';
            row.append(cell);
            return;
          }
          const wrap = document.createElement('div');
          wrap.className = 'ladder-cell';
          list.forEach((model) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'ladder-model';
            button.textContent = model.model;
            button.addEventListener('click', () => openModal(model.model));
            wrap.append(button);
          });
          cell.append(wrap);
          row.append(cell);
        });
        fragment.append(row);
      });
      ladderBody.replaceChildren(fragment);
    };

    // 详情弹层的属性行：排名在最前，官网在最后，中间复用对比模式的属性定义；
    // 该模型没有跑分的 benchmark 直接不列出，其他属性没有数据时仍显示 -
    const buildDetailRows = (model) => {
      const { rows, plainRows } = buildCompareRows();
      const rankRow = plainRows.find((definition) => definition.key === 'rank');
      const urlRow = plainRows.find((definition) => definition.key === 'url');
      const attributeRows = rows.filter((definition) => (
        !String(definition.key ?? '').startsWith('benchmark:') || !isMissing(definition.value(model))
      ));
      return [rankRow, ...attributeRows, urlRow].filter(Boolean);
    };

    const renderModal = () => {
      const model = modalModel ? modelMap.get(modalModel) : null;
      if (!model) {
        modal.hidden = true;
        modalBody.replaceChildren();
        return;
      }
      modal.hidden = false;
      modalTitle.textContent = model.model;
      const brandWrap = document.createElement('span');
      brandWrap.className = 'brand-cell';
      const icon = createBrandIcon(model.brand);
      if (icon) brandWrap.append(icon);
      const brandLabel = document.createElement('span');
      brandLabel.textContent = model.brand ?? '-';
      brandWrap.append(brandLabel);
      modalBrand.replaceChildren(brandWrap);
      modalClose.title = t('closeModal');
      modalClose.setAttribute('aria-label', t('closeModal'));

      const fragment = document.createDocumentFragment();
      buildDetailRows(model).forEach((definition) => {
        const row = document.createElement('tr');
        const label = document.createElement('th');
        label.scope = 'row';
        label.textContent = definition.label;
        row.append(label);
        const value = document.createElement('td');
        if (definition.link) {
          if (model.url) {
            const link = document.createElement('a');
            link.className = 'website-link';
            link.href = model.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = t('website');
            value.append(link);
          } else {
            value.className = 'missing';
            value.textContent = '-';
          }
        } else {
          const text = definition.format(model);
          value.textContent = text;
          if (text === '-') value.className = 'missing';
          appendRankSuffix(value, definition, model);
        }
        row.append(value);
        fragment.append(row);
      });
      modalBody.replaceChildren(fragment);
    };

    const openModal = (key) => {
      modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      modalModel = key;
      renderModal();
      // 弹层打开期间把主内容标记为 inert，焦点只能停留在弹层内，同时锁掉背景滚动
      pageMain.inert = true;
      document.documentElement.style.overflow = 'hidden';
      modalClose.focus();
    };

    const closeModal = () => {
      if (!modalModel) return;
      modalModel = null;
      renderModal();
      pageMain.inert = false;
      document.documentElement.style.overflow = '';
      if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
      modalReturnFocus = null;
    };

    modalClose.addEventListener('click', closeModal);
    // 只有按下与松开都发生在遮罩上才关闭，避免在弹层内框选文字时误关
    modal.addEventListener('mousedown', (event) => {
      overlayPressed = event.target === modal;
    });
    modal.addEventListener('click', (event) => {
      const shouldClose = overlayPressed && event.target === modal;
      overlayPressed = false;
      if (shouldClose) closeModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeModal();
    });

    // 切换按钮只更新文案与选中态，不重建节点，避免键盘操作时焦点丢失
    const viewOptions = [['rank', 'viewRank'], ['ladder', 'viewLadder']].map(([mode, key]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'view-option';
      button.addEventListener('click', () => {
        if (viewMode === mode) return;
        viewMode = mode;
        closeModal();
        render();
      });
      viewToggle.append(button);
      return { mode, key, button };
    });

    const renderViewToggle = () => {
      viewOptions.forEach(({ mode, key, button }) => {
        button.textContent = t(key);
        button.setAttribute('aria-pressed', String(viewMode === mode));
      });
    };

    const renderBrandFilter = () => {
      const counts = new Map();
      models.forEach((model) => {
        const brand = model.brand;
        counts.set(brand, (counts.get(brand) ?? 0) + 1);
      });
      const brands = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh-CN', { sensitivity: 'base' }))
        .map(([brand]) => brand);
      const fragment = document.createDocumentFragment();
      brands.forEach((brand) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'brand-chip';
        chip.dataset.brand = brand;
        const chipIcon = createBrandIcon(brand);
        if (chipIcon) chip.append(chipIcon);
        const chipLabel = document.createElement('span');
        chipLabel.textContent = brand;
        chip.append(chipLabel);
        const pressed = selectedBrands.has(brand);
        chip.setAttribute('aria-pressed', String(pressed));
        chip.addEventListener('click', () => {
          if (selectedBrands.has(brand)) selectedBrands.delete(brand);
          else selectedBrands.add(brand);
          render();
        });
        fragment.append(chip);
      });
      brandFilter.replaceChildren(fragment);
    };

    const render = () => {
      // 对比模式优先，此时不允许切到天梯，切换控件整体隐藏；
      // 数据未就绪时也不进天梯，避免加载失败的提示被空表盖住
      const hasModels = models.length > 0;
      const ladderMode = viewMode === 'ladder' && !compareMode && hasModels;
      renderViewToggle();
      viewToggle.hidden = compareMode || !hasModels;
      renderBrandFilter();
      renderSelection();
      renderModal();
      // 对比模式与天梯模式下都隐藏主表格、厂商过滤与状态文字，天梯模式另外隐藏选中态
      brandFilter.hidden = compareMode || ladderMode;
      status.hidden = compareMode || ladderMode;
      if (ladderMode) selectionBar.hidden = true;
      tableWrap.hidden = compareMode || ladderMode;
      compareWrap.hidden = !compareMode;
      ladderWrap.hidden = !ladderMode;
      if (compareMode) {
        renderCompare();
      } else if (ladderMode) {
        renderLadder();
      } else {
        renderHeader();
        renderRows();
        if (loadFailed) showError(i18n[lang].emptyError);
      }
      buildStickyHead();
      syncChrome();
    };

    // 横向滚动辅助与吸顶表头：作用于排名表、对比表与天梯表
    // 当前需要横向滚动辅助的表格容器：对比模式用对比表，天梯用天梯表，其余用排名表
    const getActiveWrap = () => {
      if (compareMode) return compareWrap;
      return viewMode === 'ladder' ? ladderWrap : tableWrap;
    };

    const getActiveTable = () => {
      if (compareMode) return compareTable;
      return viewMode === 'ladder' ? ladderTable : table;
    };

    // 克隆当前表头；排序按钮的点击按下标委托回原表头按钮，排序逻辑保持单一入口
    const buildStickyHead = () => {
      stickyHeadThead.replaceChildren();
      const sourceRow = getActiveTable().querySelector('thead tr');
      if (!sourceRow) return;
      stickyHeadThead.append(sourceRow.cloneNode(true));
      stickyHead.classList.toggle('sticky-head--rank', !compareMode && viewMode !== 'ladder');
      stickyHead.classList.toggle('sticky-head--compare', compareMode);
      stickyHead.classList.toggle('sticky-head--ladder', !compareMode && viewMode === 'ladder');
    };

    stickyHead.addEventListener('click', (event) => {
      const button = event.target.closest('.sort-button');
      if (!button) return;
      const index = [...stickyHeadThead.querySelectorAll('.sort-button')].indexOf(button);
      getActiveTable().querySelectorAll('thead .sort-button')[index]?.click();
    });

    // 列宽与内边距跟随原表头，保证克隆条与表格主体逐列对齐
    const syncStickyHeadWidths = () => {
      const sourceCells = getActiveTable().querySelectorAll('thead th');
      stickyHeadThead.querySelectorAll('th').forEach((cell, index) => {
        const source = sourceCells[index];
        if (!source) return;
        cell.style.width = `${source.offsetWidth}px`;
        const style = getComputedStyle(source);
        cell.style.paddingLeft = style.paddingLeft;
        cell.style.paddingRight = style.paddingRight;
      });
    };

    // 同步克隆条的显隐、位置与横向偏移；原表头滚出视口上缘且表格仍在视口内时显示
    const syncStickyHead = () => {
      const wrap = getActiveWrap();
      if (!wrap || wrap.hidden) {
        stickyHead.hidden = true;
        return;
      }
      const activeTable = getActiveTable();
      const headHeight = activeTable.querySelector('thead').offsetHeight;
      const rect = wrap.getBoundingClientRect();
      const show = rect.top < 0 && rect.bottom > headHeight;
      const wasHidden = stickyHead.hidden;
      stickyHead.hidden = !show;
      if (!show) return;
      if (wasHidden) syncStickyHeadWidths();
      stickyHead.style.left = `${rect.left}px`;
      stickyHead.style.width = `${rect.width}px`;
      stickyHead.style.height = `${headHeight}px`;
      stickyHeadTable.style.width = `${activeTable.offsetWidth}px`;
      const scrollLeft = wrap.scrollLeft;
      stickyHeadTable.style.transform = `translateX(${-scrollLeft}px)`;
      // 固定列反向平移，使其停留在克隆条左缘，与表格主体的固定列对齐
      const pinCount = !compareMode && viewMode !== 'ladder' ? 2 : 1;
      stickyHeadThead.querySelectorAll('th').forEach((cell, index) => {
        cell.style.transform = index < pinCount ? `translateX(${scrollLeft}px)` : '';
      });
    };

    const syncNavButtons = () => {
      const wrap = getActiveWrap();
      const canScroll = wrap && !wrap.hidden && wrap.scrollWidth > wrap.clientWidth + 1;
      scrollNavLeft.hidden = !canScroll || wrap.scrollLeft <= 0;
      scrollNavRight.hidden = !canScroll || wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;
    };

    // 模型名称列的固定偏移量等于 # 列的实际宽度，每次渲染后重新测量
    const syncPinnedColumns = () => {
      const rankCell = table.querySelector('thead th');
      if (rankCell) tableWrap.style.setProperty('--pin-2', `${rankCell.offsetWidth}px`);
    };

    const syncChrome = () => {
      syncPinnedColumns();
      syncNavButtons();
      syncStickyHead();
      if (!stickyHead.hidden) syncStickyHeadWidths();
    };

    const scrollActiveWrap = (direction) => {
      const wrap = getActiveWrap();
      if (wrap) wrap.scrollBy({ left: direction * wrap.clientWidth, behavior: 'smooth' });
    };

    scrollNavLeft.addEventListener('click', () => scrollActiveWrap(-1));
    scrollNavRight.addEventListener('click', () => scrollActiveWrap(1));
    window.addEventListener('scroll', syncStickyHead, { passive: true });
    window.addEventListener('resize', syncChrome);
    [tableWrap, compareWrap, ladderWrap].forEach((wrap) => {
      wrap.addEventListener('scroll', () => {
        syncNavButtons();
        syncStickyHead();
      }, { passive: true });
    });

    const applyLanguage = () => {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        const key = node.dataset.i18n;
        const value = i18n[lang][key];
        if (typeof value === 'string') node.textContent = value;
      });
      langToggle.textContent = i18n[lang === 'zh' ? 'en' : 'zh'].toggleLabel;
      langToggle.setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换为中文');
      brandFilter.setAttribute('aria-label', i18n[lang].brandGroup);
      viewToggle.setAttribute('aria-label', i18n[lang].viewGroup);
      scrollNavLeft.setAttribute('aria-label', i18n[lang].scrollLeft);
      scrollNavRight.setAttribute('aria-label', i18n[lang].scrollRight);
    };

    langToggle.addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      applyLanguage();
      render();
      renderUpdatedAt();
      if (models.length && benchmarks.length) {
        status.textContent = i18n[lang].status(models.length, benchmarks.length);
      }
    });

    const showError = (message) => {
      tableHead.replaceChildren();
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.className = 'error';
      cell.textContent = message;
      row.append(cell);
      tableBody.replaceChildren(row);
    };

    renderViewToggle();

    fetch('./score.json')
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        models = (Array.isArray(data.models) ? data.models : []).map((entry) => ({
          ...entry.modelInfo,
          score: entry.rank,
        }));
        priceMap = data.priceMap ?? {};
        brandIcons = data.icons ?? {};
        updatedAt = data.updatedAt ?? null;
        benchmarks = (Array.isArray(data.benchmarks) ? data.benchmarks : [])
          .filter((benchmark) => !benchmark.upgrade)
          .map((benchmark) => benchmark.name);

        if (!models.length || !benchmarks.length) {
          throw new Error(i18n[lang].noDataError);
        }

        modelMap = new Map(models.map((model) => [model.model, model]));
        rankMap = new Map(
          [...models]
            .sort((a, b) => compareValues(getSortValue(b, 'score'), getSortValue(a, 'score'))
              || a.model.localeCompare(b.model, 'zh-CN'))
            .map((model, index) => [model.model, index + 1]),
        );
        priceNormMap = (() => {
          const items = models
            .map((model) => ({ model, index: getPriceIndex(model) }))
            .filter(({ index }) => index !== null);
          const indices = items.map(({ index }) => index);
          const min = Math.min(...indices);
          const max = Math.max(...indices);
          const range = max - min;
          const map = new Map();
          items.forEach(({ model, index }) => {
            const norm = range === 0 ? 1 : (max - index) / range;
            map.set(model.model, norm);
          });
          return map;
        })();

        render();
        renderUpdatedAt();
        status.textContent = i18n[lang].status(models.length, benchmarks.length);
      })
      .catch((error) => {
        console.error('Unable to load score.json:', error);
        // 没有数据时天梯无内容可展示，回到排名视图，保证错误信息可见
        loadFailed = true;
        viewMode = 'rank';
        compareMode = false;
        render();
        status.textContent = i18n[lang].loadFailed;
      });
  </script>
</body>
</html>
